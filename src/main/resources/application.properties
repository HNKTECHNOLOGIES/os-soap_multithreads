# SOAP
soap.host=localhost
soap.port=8080
soap.context=/ws/declarations

# PostgreSQL
db.url=jdbc:postgresql://localhost:5432/gesloc
db.username=${DB_USERNAME}
db.password=${DB_PASSWORD}
db.schema=glccurlschema

# HikariCP
db.pool.maximumSize=10
db.pool.minimumIdle=2
db.pool.connectionTimeout=500
db.pool.poolName=evaloc-hikari

# Parallel execution
parallel.enabled=true
parallel.partitions=4
parallel.corePoolSize=4
parallel.maximumPoolSize=8
parallel.queueCapacity=8

# Timeout (budget interne < DAC 3s)
os.timeout.ms=2500
os.dac.timeout.ms=3000

# Pagination
pagination.defaultSize=50
pagination.maxSize=200

# Partition bounds cache (TTL en millisecondes, 0 = indéfini jusqu'au redémarrage)
partition.bounds.ttl.ms=3600000
